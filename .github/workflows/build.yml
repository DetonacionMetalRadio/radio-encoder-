name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Crear App
        run: |
          rm -f build.gradle.kts settings.gradle.kts
          mkdir -p app/src/main/java/com/detonacion/radioencoder
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.detonacion.radioencoder'
            compileSdk 34
            defaultConfig {
              applicationId 'com.detonacion.radioencoder'
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName '1.2'
            }
            buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="RadioEncoder" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/detonacion/radioencoder/MainActivity.kt <<'EOF'
          package com.detonacion.radioencoder
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val t = TextView(this)
              t.text = "RADIO ENCODER\nDetonacion Metal Radio\nYa abre jefe!"
              t.textSize = 24f
              setContentView(t)
            }
          }
          EOF
      - uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          build-root-directory: .
          gradle-version: '8.7'
      - name: Crear Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.2
          name: RadioEncoder v1.2 - Ya Abre
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
